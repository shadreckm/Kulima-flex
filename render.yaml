# Render Blueprint for Kulima OS API
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting the GitHub repo, apply this blueprint or mirror these
# settings in the Render dashboard.

services:
  - type: web
    name: kulima-os-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    disk:
      name: kulima-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: NEXTAUTH_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: KULIMA_DB_PATH
        value: /data/kulima.db
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: SYNDICATE_MODEL
        value: gpt-4.1-mini
      - key: FUTURES_MODEL
        value: gpt-4.1-mini
      - key: KULIMA_RATE_LIMIT_REQUESTS
        value: "60"
      - key: KULIMA_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: PYTHONPATH
        value: /app
      # Enterprise Trust & Monetization (Phases 5, 7, 8)
      - key: KULIMA_BILLING_ENFORCEMENT
        value: "false" # flip to true when ready to enforce plan quotas
      - key: KULIMA_BILLING_DEMO_MODE
        value: "false"
      - key: KULIMA_GRACE_PERIOD_DAYS
        value: "7"
      - key: KULIMA_PLAN_CURRENCY
        value: USD
      - key: KULIMA_PLAN_PRICING_JSON
        sync: false # optional pricing overrides, e.g. {"pro": {"monthlyPrice": 49}}
      - key: KULIMA_DOC_ENCRYPTION_KEY
        sync: false # set to enable AES-256-GCM at-rest encryption
      - key: KULIMA_DEFAULT_RETENTION_DAYS
        value: "0"
      - key: PAYCHANGU_SECRET_KEY
        sync: false
      - key: PAYCHANGU_WEBHOOK_SECRET
        sync: false
      - key: PAYCHANGU_CURRENCY
        value: USD
      - key: PAYCHANGU_API_BASE
        sync: false
